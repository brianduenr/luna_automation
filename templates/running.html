<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Test...</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <h1>Running Test...</h1>

    <h2>Logs:</h2>
    <div id="logs" style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll;"></div>

    <a href="/results">View Results</a>

    <script>
        var socket = io();
        var task_id = '{{ task_id }}';

        socket.on('connect', function() {
            console.log('Connected to server');
            setInterval(function() {
                socket.emit('get_logs', {task_id: task_id});
            }, 1000);
        });

        socket.on('log_message', function(data) {
            var logs = document.getElementById('logs');
            logs.innerHTML += '<p>' + data.message + '</p>';
            logs.scrollTop = logs.scrollHeight;
        });

        socket.on('task_complete', function(data) {
            var logs = document.getElementById('logs');
            logs.innerHTML += '<p><b>' + data.message + '</b></p>';
            logs.scrollTop = logs.scrollHeight;
        });

        socket.on('task_failed', function(data) {
            var logs = document.getElementById('logs');
            logs.innerHTML += '<p><b>' + data.message + '</b></p>';
            logs.scrollTop = logs.scrollHeight;
        });
    </script>
</body>
</html>
